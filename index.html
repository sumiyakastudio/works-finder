<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AKASHIKI Works Finder｜条件から制作実績を探す</title>
    <meta
      name="description"
      content="AKASHIKI（墨家）の制作実績を、業種・サイト種別・制作目的・技術要素の4軸で絞り込んで探せる検索ツール。LPからマルチページのブランドサイトまで、公開中の全24件を掲載しています。"
    />
    <meta name="theme-color" content="#08090a" />
    <link rel="canonical" href="https://sumiyakaa.github.io/works-finder/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AKASHIKI Works Finder" />
    <meta property="og:title" content="AKASHIKI Works Finder｜条件から制作実績を探す" />
    <meta
      property="og:description"
      content="業種・サイト種別・制作目的・技術要素の4軸で、AKASHIKI の制作実績を絞り込んで探せる検索ツール。"
    />
    <meta property="og:url" content="https://sumiyakaa.github.io/works-finder/" />
    <meta property="og:image" content="https://sumiyakaa.github.io/works-finder/assets/images/meta/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/assets/images/meta/favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="apple-touch-icon" href="/assets/images/meta/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=Noto+Sans+JP:wght@300..700&display=swap"
      rel="stylesheet"
    />

    <script>
      // 初回ペイント前にテーマを確定させ、切り替わりのちらつきを防ぐ
      (function () {
        try {
          var stored = localStorage.getItem('ads-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

    <style>
      /* バンドル読み込み前の地色。globals.css のトークンと同値 */
      html[data-theme='dark'] body {
        background: #08090a;
        color: #f7f8f8;
      }
      html[data-theme='light'] body {
        background: #fbfbfb;
        color: #08090a;
      }
      body {
        margin: 0;
        min-width: 320px;
        font-family: 'Inter', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Segoe UI',
          'Hiragino Sans', 'Yu Gothic', sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
